<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Divya Hariharan — Lecturer, Researcher &amp; Author</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230A0A0A%27/%3E%3Ctext x=%2732%27 y=%2742%27 font-family=%27Arial%27 font-weight=%27800%27 font-size=%2726%27 text-anchor=%27middle%27 fill=%27%23F5F5F5%27%3EDH%3C/text%3E%3C/svg%3E" />
<meta name="description" content="Portfolio of Divya Hariharan: English literature lecturer, researcher and author based in Muscat, Oman." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<style>
#boot{position:fixed;inset:0;z-index:9999;background:#0A0A0A;display:grid;place-items:center;transition:opacity .6s cubic-bezier(.16,1,.3,1),visibility .6s}
#boot.done{opacity:0;visibility:hidden;pointer-events:none}
#boot .bw{display:flex;flex-direction:column;align-items:center;gap:22px}
#boot .ring{width:46px;height:46px;border-radius:50%;border:2px solid #262626;border-top-color:#F5F5F5;animation:boot-spin .9s linear infinite}
#boot .name{font:700 15px/1 'Lexend',system-ui,sans-serif;letter-spacing:.18em;color:#F5F5F5;text-transform:uppercase;opacity:0;animation:boot-in .8s cubic-bezier(.16,1,.3,1) .15s forwards}
#boot .bar{width:120px;height:1px;background:#262626;overflow:hidden}
#boot .bar i{display:block;height:100%;width:40%;background:#F5F5F5;animation:boot-bar 1.2s cubic-bezier(.65,0,.35,1) infinite}
@keyframes boot-spin{to{transform:rotate(360deg)}}
@keyframes boot-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes boot-bar{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@media (prefers-reduced-motion:reduce){#boot .ring,#boot .bar i{animation-duration:3s}#boot .name{animation:none;opacity:1}}
</style>
<div id="boot" aria-hidden="true"><div class="bw"><div class="ring"></div><div class="name">Divya Hariharan</div><div class="bar"><i></i></div></div></div>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
